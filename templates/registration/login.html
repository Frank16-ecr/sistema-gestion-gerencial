{% extends "panel/base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Iniciar sesión</h1>
  <p class="muted">Accede al panel gerencial de tus empresas.</p>
  {% if form.errors %}<div class="alert danger">Usuario o contraseña incorrectos.</div>{% endif %}
  <form method="post">{% csrf_token %}
    <label>Usuario <input type="text" name="username" autocomplete="username" required autofocus></label>
    <label>Contraseña <input type="password" name="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
