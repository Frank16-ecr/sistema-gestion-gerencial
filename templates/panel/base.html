<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SGG{% endblock %} · Sistema de Gestión Gerencial</title>
  <style>
    :root {
      --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --text: #1c2430; --muted: #5e6b7a;
      --border: #dfe3e8; --accent: #2457c5; --accent-text: #ffffff;
      --ok: #1f7a4d; --warn: #9a6100; --danger: #b42318; --info: #2457c5;
      --ok-bg: #e7f5ee; --warn-bg: #fdf3e1; --danger-bg: #fdecea; --info-bg: #e8effc;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12161c; --surface: #1a2028; --surface-2: #222a34; --text: #e6eaf0; --muted: #9aa6b4;
        --border: #2e3844; --accent: #6d9bff; --accent-text: #0d1117;
        --ok: #5fcf97; --warn: #f0b955; --danger: #ff8a80; --info: #8fb2ff;
        --ok-bg: #16301f; --warn-bg: #33270f; --danger-bg: #3a1a18; --info-bg: #1a2640;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: var(--accent); }
    header.top { background: var(--surface); border-bottom: 1px solid var(--border); }
    header.top .inner { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex;
                        align-items: center; gap: 16px; flex-wrap: wrap; }
    .brand { font-weight: 700; letter-spacing: .2px; }
    .brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
    .spacer { flex: 1; }
    nav.links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
    main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
    .kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin: 16px 0; }
    .kpi .label { color: var(--muted); font-size: 13px; }
    .kpi .value { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .pos { color: var(--ok); } .neg { color: var(--danger); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 6px 4px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    tr:last-child td { border-bottom: 0; }
    .bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 4px; }
    .bar > span { display: block; height: 100%; background: var(--ok); }
    .bar.warn > span { background: var(--warn); } .bar.danger > span { background: var(--danger); }
    .alert { padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
    .alert.danger { background: var(--danger-bg); color: var(--danger); }
    .alert.warning { background: var(--warn-bg); color: var(--warn); }
    .alert.info { background: var(--info-bg); color: var(--info); }
    form.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
    input, select, button { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
                            background: var(--surface); color: var(--text); }
    button { background: var(--accent); color: var(--accent-text); border-color: var(--accent); cursor: pointer; }
    .empty { color: var(--muted); font-size: 14px; margin: 0; }
    .scroll { overflow-x: auto; }
    .narrow { max-width: 380px; margin: 8vh auto; }
    .narrow form { display: flex; flex-direction: column; gap: 12px; }
  </style>
</head>
<body>
  <header class="top">
    <div class="inner">
      <span class="brand">SGG<small>Sistema de Gestión Gerencial</small></span>
      <span class="spacer"></span>
      {% if user.is_authenticated %}
      <nav class="links">
        <a href="{% url 'panel' %}">Panel</a>
        <a href="{% url 'swagger-ui' %}">API</a>
        {% if user.is_staff %}<a href="{% url 'admin:index' %}">Administración</a>{% endif %}
        <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}
          <button type="submit" style="padding:2px 10px">Salir ({{ user.get_username }})</button>
        </form>
      </nav>
      {% endif %}
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
