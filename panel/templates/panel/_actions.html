{% for a in actions %}{% if a.method == 'get' %}<a class="btn {{ a.style }} {% if small %}small{% endif %}" href="{{ a.url }}">{{ a.label }}</a>{% else %}<form method="post" action="{{ a.url }}" class="inline-form"{% if a.confirm %} data-confirm="{{ a.confirm }}"{% endif %}{% if a.prompt %} data-prompt="{{ a.prompt }}"{% endif %}>{% csrf_token %}{% if a.next %}<input type="hidden" name="next" value="{{ a.next }}">{% endif %}{% if a.prompt %}<input type="hidden" name="reason" value="">{% endif %}<button class="btn {{ a.style }} {% if small %}small{% endif %}" type="submit">{{ a.label }}</button></form>{% endif %} {% endfor %}
