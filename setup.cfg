[flake8]
max-line-length = 120
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    migrations,
    staticfiles,
    media,
    .eggs,
    build,
    dist
extend-ignore = E203, W503

[isort]
profile = django
line_length = 120
skip = migrations,.venv,venv,staticfiles,media
known_django = django
known_third_party = rest_framework,django_filters,corsheaders,drf_spectacular,celery,decouple
known_first_party = zelani,tenants,finance
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
